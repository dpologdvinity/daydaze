<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Lion - Character Customizer & Trait Compositor</title>
  <style>
    :root {
      --bg: #0f1015;
      --panel: #181922;
      --card: #20222e;
      --border: #2d3042;
      --accent: #f59e0b;
      --accent-pink: #ec4899;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Left: Viewport Stage */
    .stage-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #26293d 0%, #0f1015 70%);
      padding: 24px;
      position: relative;
    }
    .stage-header {
      position: absolute;
      top: 20px;
      left: 24px;
    }
    .stage-header h1 {
      font-size: 1.6rem;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stage-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .viewport-card {
      width: 440px;
      height: 440px;
      background: #15161f;
      border: 2px solid var(--border);
      border-radius: 16px;
      position: relative;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    /* Layer Stacking */
    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: contain;
    }
    .base-doll {
      background: #dfa882;
      border-radius: 50% 50% 45% 45% / 40% 40% 60% 60%;
      width: 220px;
      height: 250px;
      position: absolute;
      top: 90px;
      left: 110px;
      box-shadow: inset 0 -12px 24px rgba(0,0,0,0.15);
      transition: background-color 0.2s ease;
    }
    .base-neck {
      background: #dfa882;
      width: 50px;
      height: 80px;
      position: absolute;
      top: 310px;
      left: 195px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }
    .base-chest {
      background: #dfa882;
      width: 240px;
      height: 90px;
      position: absolute;
      top: 360px;
      left: 100px;
      border-radius: 50px 50px 0 0;
      transition: background-color 0.2s ease;
    }

    /* Right: Controls Panel */
    .controls-panel {
      width: 480px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .category-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #14151d;
    }
    .tab-btn {
      padding: 14px 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #fbbf24;
      border-bottom-color: #fbbf24;
      background: rgba(251, 191, 36, 0.05);
    }
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .section-title {
      font-size: 0.95rem;
      color: #fbbf24;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .color-swatch {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch:hover, .color-swatch.active {
      transform: scale(1.15);
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }
    .trait-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .trait-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .trait-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .trait-card.active {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.12);
    }
    .trait-card img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }
    .trait-card span {
      font-size: 0.75rem;
      color: var(--text);
      display: block;
      word-break: break-word;
    }
    .clear-btn {
      width: 100%;
      padding: 8px;
      background: #2a2c3d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
    .clear-btn:hover {
      color: #fff;
      background: #36394e;
    }
  </style>
</head>

      <div id="base-chest" class="base-chest" style="display: none;"></div>

    let activeTab = "hair";
    const selectedTraits = {};

    function updateSkin(tone) {
      document.getElementById("layer-template-doll").src = tone.src;
      document.getElementById("base-doll").style.backgroundColor = tone.hex;
      document.getElementById("base-neck").style.backgroundColor = tone.hex;
      document.getElementById("base-chest").style.backgroundColor = tone.hex;
    }

    function toggleTrait(category, trait) {
      const layerId = "layer-" + category;
      const img = document.getElementById(layerId);
      if (!img) return;

      if (selectedTraits[category] && selectedTraits[category].id === trait.id) {
        delete selectedTraits[category];
        img.style.display = "none";
        img.src = "";
        if (category === "hair") {
          const backImg = document.getElementById("layer-hair-back");
          if (backImg) {
            backImg.style.display = "none";
            backImg.src = "";
          }
        }
      } else {
        selectedTraits[category] = trait;
        img.src = trait.src;
        img.style.display = "block";
        if (category === "hair") {
          const backImg = document.getElementById("layer-hair-back");
          if (backImg) {
            if (trait.backSrc) {
              backImg.src = trait.backSrc;
              backImg.style.display = "block";
            } else {
              backImg.style.display = "none";
              backImg.src = "";
            }
          }
        }
      }
      renderTab();
    }

    function clearCategory(category) {
      delete selectedTraits[category];
      const img = document.getElementById("layer-" + category);
      if (img) {
        img.style.display = "none";
        img.src = "";
      }
      if (category === "hair") {
        const backImg = document.getElementById("layer-hair-back");
        if (backImg) {
          backImg.style.display = "none";
          backImg.src = "";
        }
      }
      renderTab();
    }

    function renderTab() {
      const container = document.getElementById("tab-content");
      container.innerHTML = "";

      if (activeTab === "skin") {
        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "Select Skin Tone";
        container.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "palette-grid";
        SKIN_TONES.forEach(tone => {
          const swatch = document.createElement("div");
          swatch.className = "color-swatch";
          swatch.style.backgroundColor = tone.hex;
          swatch.title = tone.name;
          swatch.onclick = () => updateSkin(tone);
          grid.appendChild(swatch);
        });
        container.appendChild(grid);
        return;
      }

      const traits = TRAITS_DATA[activeTab] || [];
      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = activeTab + " Options (" + traits.length + ")";
      container.appendChild(title);

      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-btn";
      clearBtn.textContent = "Remove " + activeTab;
      clearBtn.onclick = () => clearCategory(activeTab);
      container.appendChild(clearBtn);

      const grid = document.createElement("div");
      grid.className = "trait-grid";
      traits.forEach(trait => {
        const card = document.createElement("div");
        const isSelected = selectedTraits[activeTab] && selectedTraits[activeTab].id === trait.id;
        card.className = "trait-card" + (isSelected ? " active" : "");
        card.onclick = () => toggleTrait(activeTab, trait);

        const img = document.createElement("img");
        img.src = trait.src;
        img.alt = trait.name;
        img.loading = "lazy";

        const label = document.createElement("span");
        label.textContent = trait.name;

        card.appendChild(img);
        card.appendChild(label);
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        renderTab();
      };
    });

    // Initialize with verified modular traits
    toggleTrait("hair", TRAITS_DATA.hair[0]);
    toggleTrait("brows", TRAITS_DATA.brows[0]);
    toggleTrait("lips", TRAITS_DATA.lips[0]);
    toggleTrait("clothes", TRAITS_DATA.clothes[0]);
    toggleTrait("piercings", TRAITS_DATA.piercings[0]);
    renderTab();
  </script>
</body>
</html>
