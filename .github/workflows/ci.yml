# Continuous integration for every push and pull request to main: install
# (cached), lint, format and type checks, the unit tests with coverage, and
# the production build. The slow browser suites live in playwright.yml and run
# beside this on the same triggers. A pushed v* tag also drafts a GitHub
# release with the build.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# a newer push to the same branch or PR cancels the run in progress; runs on main
# finish, or the status badge reads the latest cancelled run as failing
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  setup:
    name: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the dependency tree
        run: npm ls --omit=optional > /dev/null
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # the ESLint, Prettier and tsc caches (npm run lint / format:check / typecheck
      # write into .cache); without this every run pays the cold cost
      - uses: actions/cache@v6
        with:
          path: .cache
          key: lint-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: lint-cache-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Ruff (Python scripts in art/ and scripts/)
        run: pipx run ruff==0.17.2 check .
      - name: Markdownlint (docs)
        run: npm run lint:md
      - name: Dead code (Knip)
        run: npm run lint:dead
      - name: File headers
        run: npm run lint:headers
      - name: Layer rules (dependency-cruiser)
        run: npm run lint:deps
      - name: Spelling (American English)
        run: npm run lint:spelling
      - name: Prettier
        run: npm run format:check
      - name: TypeScript (client, game and Worker)
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            tail -n 40 coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Performance budget (initial JS under 600 KB gzipped)
        run: npm run perf:budget
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Package the build
        run: tar -czf daydaze-${{ github.ref_name }}.tar.gz -C dist .
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          draft: true
          generate_release_notes: true
          files: daydaze-${{ github.ref_name }}.tar.gz
