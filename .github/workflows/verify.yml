name: Verify
# npm run verify (lint, tests, typecheck, format, build) on GitHub's runners
# for every pushed work branch, so agents don't load the owner's machine.
# The land script pushes a rebased branch to ci/** and waits for this.
on:
  push:
    branches: ["feat/**", "fix/**", "perf/**", "ci/**"]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v5
        with:
          path: .cache
          key: verify-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: verify-cache-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run verify
