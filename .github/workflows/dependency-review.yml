name: Dependency review
# Blocks a pull request that adds or bumps a dependency with a known high or
# critical vulnerability (GitHub's advisory database), before it reaches main.
# Complements `npm audit` in ci.yml, which only audits what main already has.
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
