name: Tests
# Runs only when started by hand (Actions tab, "Run workflow"), to save the
# private repo's Actions minutes; checks run locally before every push.
on:
  workflow_dispatch:
jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
  browser:
    needs: verify
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # the client suite is long on SwiftShader: four runners share it
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Headless WebGL runs on SwiftShader, so these are slow but real.
      - run: npm run test:e2e:client -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
  minigames:
    needs: verify
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-minigames
          path: test-results/
          retention-days: 14
